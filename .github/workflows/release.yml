# Push a tag like v0.1.0 to build hooktop for macOS and Linux, publish a
# GitHub release with the tarballs, and update the Homebrew tap.
#
# For the tap update, add a repository secret HOMEBREW_TAP_TOKEN: a
# fine-grained token on nazliander/homebrew-tap with "Contents" and "Pull
# requests" set to read and write. The formula change goes in as a pull
# request that the workflow merges, so the tap's main branch can require
# pull requests. Without the secret the release still happens and the
# formula is attached to it, ready to copy by hand.
#
# To publish to crates.io too, add a repository secret CARGO_REGISTRY_TOKEN:
# a crates.io API token with the "publish-update" scope (and "publish-new"
# for the very first release). Without it, the crates.io job is skipped.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist), e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  TAP: nazliander/homebrew-tap

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Tag matches the Cargo version
        run: |
          want="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$TAG" != "$want" ]; then
            echo "::error::tag $TAG doesn't match Cargo.toml version $want"
            exit 1
          fi
      - name: CHANGELOG.md has notes for this version
        run: |
          if [ -z "$(packaging/release-notes.sh "$TAG")" ]; then
            echo "::error::no notes for ${TAG#v} in CHANGELOG.md; run packaging/release.sh ${TAG#v} before tagging"
            exit 1
          fi

  crates:
    needs: check
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Publish hooktop-core and hooktop
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::notice::no CARGO_REGISTRY_TOKEN secret, skipping crates.io"
            exit 0
          fi
          version="${TAG#v}"
          # A re-run must not fail on a version that's already up.
          if curl -sf "https://index.crates.io/ho/ok/hooktop" | grep -q "\"vers\":\"$version\""; then
            echo "hooktop $version is already on crates.io"
            exit 0
          fi
          cargo publish --workspace --locked

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p hooktop
      - name: Package
        shell: bash
        run: |
          name="hooktop-$TAG-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/hooktop" README.md CHANGELOG.md LICENSE NOTICE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "$name.tar.gz"; else shasum -a 256 "$name.tar.gz"; fi > "$name.tar.gz.sha256"
          cat "$name.tar.gz.sha256"
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin' || runner.arch == 'X64'
        run: target/${{ matrix.target }}/release/hooktop --version
      - uses: actions/upload-artifact@v5
        with:
          name: hooktop-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # tags, for the compare link in the notes
      - uses: actions/download-artifact@v5
        with:
          pattern: hooktop-*
          path: dist
          merge-multiple: true
      - name: Homebrew formula
        run: packaging/brew-formula.sh "$TAG" dist > dist/hooktop.rb && cat dist/hooktop.rb
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          packaging/release-notes.sh "$TAG" > notes.md
          printf '\nhttps://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" \
            "$(git tag --sort=-v:refname | grep -A1 -x "$TAG" | tail -1)" "$TAG" >> notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            # A release made on GitHub's page keeps its own notes, unless it has none.
            if [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
              gh release edit "$TAG" --notes-file notes.md
            fi
          else
            gh release create "$TAG" dist/* --title "hooktop $TAG" --notes-file notes.md
          fi
      - name: Update the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN isn't set; copy hooktop.rb from the release into $TAP by hand"
            exit 0
          fi
          git clone "https://x-access-token:$TAP_TOKEN@github.com/$TAP.git" tap
          mkdir -p tap/Formula
          cp dist/hooktop.rb tap/Formula/hooktop.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="hooktop-$TAG"
          git checkout -b "$branch"
          git add Formula/hooktop.rb
          if git diff --cached --quiet; then echo "formula unchanged"; exit 0; fi
          git commit -m "feat: hooktop ${TAG#v}"
          git push --force -u origin "$branch"

          # main only takes pull requests: open one and merge it.
          export GH_TOKEN="$TAP_TOKEN"
          pr=$(gh pr list --repo "$TAP" --head "$branch" --state open --json url --jq '.[0].url')
          if [ -z "$pr" ]; then
            pr=$(gh pr create --repo "$TAP" --base main --head "$branch" \
              --title "feat: hooktop ${TAG#v}" \
              --body "Updates the hooktop formula to $TAG. Opened by [hooktop's release workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).")
          fi
          echo "Pull request: $pr"
          # GitHub needs a moment to work out whether a new PR can merge.
          for _ in 1 2 3 4 5 6; do
            if gh pr merge "$pr" --repo "$TAP" --squash --delete-branch; then exit 0; fi
            sleep 10
          done
          echo "::error::couldn't merge $pr; merge it by hand"
          exit 1
